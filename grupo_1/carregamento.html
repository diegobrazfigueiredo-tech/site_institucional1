<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>José de Alencar | Carregando</title>

<!-- FONTES -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">


<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    background: #05080e;
    color: white;
    font-family: "Manrope", sans-serif;
    overflow: hidden;
}

:root {
    --black: #05080e;
    --blue: #1769d2;
    --electric: #57a0ff;
    --white: #ffffff;
    --line: rgba(255,255,255,.1);
}


/* =====================================================
   TEXTURA
===================================================== */

body::before {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 1000;

    opacity: .035;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
}


/* =====================================================
   TELA
===================================================== */

.carregamento {

    width: 100%;

    height: 100vh;

    min-height: 600px;

    position: relative;

    overflow: hidden;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(23,105,210,.18),
            transparent 35%
        ),

        #05080e;
}


/* =====================================================
   GLOW
===================================================== */

.glow {

    position: absolute;

    width: 450px;
    height: 450px;

    border-radius: 50%;

    background:
        rgba(31,116,255,.15);

    filter:
        blur(120px);

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    animation:
        pulsar 4s ease-in-out infinite;
}


/* =====================================================
   CÍRCULO EXTERNO
===================================================== */

.circulo {

    position: absolute;

    width: 560px;
    height: 560px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius: 50%;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    animation:
        girar 30s linear infinite;
}


.circulo::before {

    content: "";

    position: absolute;

    width: 380px;
    height: 380px;

    border:
        1px solid
        rgba(87,160,255,.08);

    border-radius: 50%;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);
}


/* =====================================================
   CÍRCULO INTERNO
===================================================== */

.circulo-interno {

    position: absolute;

    width: 260px;
    height: 260px;

    border:
        1px solid
        rgba(255,255,255,.05);

    border-radius: 50%;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);
}


/* =====================================================
   CONTEÚDO
===================================================== */

.conteudo {

    position: relative;

    z-index: 10;

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* =====================================================
   LOGO
===================================================== */

.logo {

    width: 90px;
    height: 90px;

    border:
        1px solid
        rgba(255,255,255,.3);

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    position: relative;

    margin-bottom: 32px;

    background:
        rgba(255,255,255,.025);

    backdrop-filter:
        blur(10px);

    animation:
        aparecer 1s
        cubic-bezier(.22,1,.36,1);
}


.logo::before {

    content: "";

    position: absolute;

    inset: -7px;

    border:
        1px solid
        rgba(87,160,255,.3);

    border-radius: 50%;

    border-top-color:
        #57a0ff;

    animation:
        girar 3.5s linear infinite;
}


.logo::after {

    content: "";

    position: absolute;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background:
        #57a0ff;

    box-shadow:
        0 0 18px #57a0ff;

    top: -10px;
}


.logo span {

    font-size: 24px;

    font-weight: 300;

    letter-spacing: -1px;

    color:
        #57a0ff;
}


/* =====================================================
   NOME
===================================================== */

.nome {

    font-size:
        clamp(24px, 4vw, 42px);

    font-weight: 300;

    letter-spacing:
        .08em;

    line-height: 1;

    text-transform:
        uppercase;

    animation:
        subir 1s .2s both;
}


/* =====================================================
   ESCOLA
===================================================== */

.escola {

    margin-top: 12px;

    font-size: 8px;

    letter-spacing: 5px;

    color:
        rgba(255,255,255,.45);

    animation:
        subir 1s .35s both;
}


/* =====================================================
   LINHA CENTRAL
===================================================== */

.linha-central {

    width: 45px;

    height: 1px;

    background:
        #57a0ff;

    margin:
        30px 0 25px;

    opacity: .7;

    animation:
        expandir 1s .45s both;
}


/* =====================================================
   MENSAGEM
===================================================== */

.mensagem {

    font-family:
        "DM Sans",
        sans-serif;

    font-size: 12px;

    font-weight: 300;

    letter-spacing: 1px;

    color:
        rgba(255,255,255,.55);

    animation:
        subir 1s .55s both;
}


/* =====================================================
   BARRA
===================================================== */

.barra {

    width:
        clamp(220px, 30vw, 300px);

    height: 1px;

    background:
        rgba(255,255,255,.12);

    margin-top: 22px;

    overflow: hidden;

    animation:
        subir 1s .65s both;
}


.progresso {

    width: 0%;

    height: 100%;

    background:
        #57a0ff;

    box-shadow:
        0 0 12px
        rgba(87,160,255,.9);

    animation:
        carregar 2.8s
        cubic-bezier(.4,0,.2,1)
        forwards;
}


/* =====================================================
   PORCENTAGEM
===================================================== */

.porcentagem {

    margin-top: 13px;

    font-size: 8px;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,.3);

    animation:
        subir 1s .7s both;
}


/* =====================================================
   PONTOS
===================================================== */

.pontos {

    margin-top: 17px;

    font-size: 9px;

    letter-spacing: 6px;

    color:
        #57a0ff;

    animation:
        subir 1s .75s both;
}


.pontos span {

    animation:
        piscando 1.4s infinite;
}


.pontos span:nth-child(2) {
    animation-delay: .2s;
}


.pontos span:nth-child(3) {
    animation-delay: .4s;
}


/* =====================================================
   CANTOS
===================================================== */

.canto {

    position: absolute;

    width: 75px;
    height: 75px;

    border-color:
        rgba(255,255,255,.12);

    z-index: 5;
}


.canto1 {

    top: 35px;
    left: 35px;

    border-top: 1px solid;
    border-left: 1px solid;
}


.canto2 {

    right: 35px;
    bottom: 35px;

    border-right: 1px solid;
    border-bottom: 1px solid;
}


/* =====================================================
   LINHAS LATERAIS
===================================================== */

.linha-lateral {

    position: absolute;

    width: 110px;
    height: 1px;

    background:
        rgba(87,160,255,.45);

    z-index: 5;
}


.linha-esquerda {

    left: 0;

    top: 45%;
}


.linha-direita {

    right: 0;

    bottom: 45%;
}


/* =====================================================
   TEXTOS LATERAIS
===================================================== */

.texto-lateral {

    position: absolute;

    font-size: 7px;

    letter-spacing: 3px;

    color:
        rgba(255,255,255,.28);

    writing-mode:
        vertical-rl;

    z-index: 10;
}


.texto-esquerda {

    left: 5vw;

    bottom: 50px;
}


.texto-direita {

    right: 5vw;

    top: 50px;
}


/* =====================================================
   ANIMAÇÕES
===================================================== */

@keyframes carregar {

    from {
        width: 0%;
    }

    to {
        width: 100%;
    }
}


@keyframes aparecer {

    from {

        opacity: 0;

        transform:
            scale(.7)
            rotate(-10deg);
    }

    to {

        opacity: 1;

        transform:
            scale(1)
            rotate(0);
    }
}


@keyframes subir {

    from {

        opacity: 0;

        transform:
            translateY(15px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


@keyframes expandir {

    from {

        width: 0;

        opacity: 0;
    }

    to {

        width: 45px;

        opacity: .7;
    }
}


@keyframes piscando {

    0%,
    100% {
        opacity: .2;
    }

    50% {
        opacity: 1;
    }
}


@keyframes pulsar {

    0%,
    100% {

        transform:
            translate(-50%, -50%)
            scale(.9);

        opacity: .45;
    }

    50% {

        transform:
            translate(-50%, -50%)
            scale(1.08);

        opacity: .75;
    }
}


@keyframes girar {

    from {

        transform:
            translate(-50%, -50%)
            rotate(0deg);
    }

    to {

        transform:
            translate(-50%, -50%)
            rotate(360deg);
    }
}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width: 600px) {

    .circulo {

        width: 430px;
        height: 430px;
    }


    .circulo::before {

        width: 290px;
        height: 290px;
    }


    .circulo-interno {

        width: 190px;
        height: 190px;
    }


    .logo {

        width: 82px;
        height: 82px;
    }


    .nome {

        font-size:
            clamp(21px, 7vw, 30px);

        letter-spacing:
            .05em;
    }


    .escola {

        font-size: 7px;

        letter-spacing: 4px;
    }


    .mensagem {

        font-size: 11px;
    }


    .canto1 {

        top: 20px;
        left: 20px;
    }


    .canto2 {

        right: 20px;
        bottom: 20px;
    }


    .texto-lateral {

        display: none;
    }


    .linha-lateral {

        width: 60px;
    }

}

</style>

</head>


<body>

<div class="carregamento">


    <!-- GLOW -->

    <div class="glow"></div>


    <!-- CÍRCULOS -->

    <div class="circulo"></div>

    <div class="circulo-interno"></div>


    <!-- CANTOS -->

    <div class="canto canto1"></div>

    <div class="canto canto2"></div>


    <!-- LINHAS -->

    <div class="linha-lateral linha-esquerda"></div>

    <div class="linha-lateral linha-direita"></div>


    <!-- TEXTOS LATERAIS -->

    <div class="texto-lateral texto-esquerda">

        EDUCAÇÃO • CONHECIMENTO • FUTURO

    </div>


    <div class="texto-lateral texto-direita">

        MACHACALIS — MG

    </div>


    <!-- CONTEÚDO -->

    <div class="conteudo">


        <!-- LOGO -->

        <div class="logo">

            <span>
                JA
            </span>

        </div>


        <!-- NOME -->

        <div class="nome">

            JOSÉ DE ALENCAR

        </div>


        <!-- ESCOLA -->

        <div class="escola">

            ESCOLA ESTADUAL

        </div>


        <!-- LINHA -->

        <div class="linha-central"></div>


        <!-- MENSAGEM -->

        <div class="mensagem">

            Preparando sua experiência...

        </div>


        <!-- BARRA -->

        <div class="barra">

            <div class="progresso"></div>

        </div>


        <!-- PORCENTAGEM -->

        <div class="porcentagem">

            <span id="porcentagem">
                0%
            </span>

        </div>


        <!-- PONTOS -->

        <div class="pontos">

            <span>•</span>

            <span>•</span>

            <span>•</span>

        </div>


    </div>


</div>


<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>

    /* CONTADOR */

    const porcentagem =
        document.getElementById("porcentagem");

    let valor = 0;

    const contador =
        setInterval(function() {

            valor++;

            porcentagem.textContent =
                valor + "%";

            if (valor >= 100) {

                clearInterval(contador);

            }

        }, 28);


    /* =================================================
       ABRIR SOBRE.HTML
    ================================================= */

    setTimeout(function() {

        window.location.href = "sobre.html";

    }, 3000);

</script>


</body>

</html>
